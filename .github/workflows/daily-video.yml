name: Daily product video

# فيديو يومي لمنتج من rax3d.com (بالنمط حسب اليوم) + وصف وهاشتاقات، يُحفظ في daily/.
# النشر على Snapchat يدوي حاليًا (لا مفتاح API بعد)؛ راجع daily/README.md.
on:
  schedule:
    - cron: '17 5 1,5,9,13,17,21,25,29 * *'      # كل 4 أيام (المالك 11-27) 08:17 بتوقيت الرياض
  workflow_dispatch:
    inputs:
      id:   { description: 'معرّف القطعة (اختياري)', required: false, default: '' }
      mode: { description: 'daily | colors | layers | hook (اختياري)', required: false, default: '' }

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout posts repo
        uses: actions/checkout@v4
        with:
          path: posts
      - name: Checkout shop (public)
        uses: actions/checkout@v4
        with:
          repository: rax3dsa/rax3d-shop
          path: shop
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg python3-numpy
          cd shop/tools/daily-video && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Build today's video
        env:
          TZ: Asia/Riyadh
        run: |
          cd shop/tools/daily-video
          node run-daily.js "$GITHUB_WORKSPACE/posts" "${{ github.event.inputs.id }}" "${{ github.event.inputs.mode }}"
      - name: Commit results
        run: |
          cd posts
          git config user.name "rax3d-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "daily video $(date +%F)" && git push; fi
